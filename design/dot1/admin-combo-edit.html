<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sửa combo — Quản trị</title>
<link rel="stylesheet" href="tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
.form-group { margin-bottom: var(--space-5); }
.course-check { display: flex; flex-direction: column; gap: var(--space-3); }
.course-check label { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border: 1px solid var(--color-border); border-radius: var(--radius-md); cursor: pointer; font-size: var(--font-sm); }
.course-check label:has(input:checked) { border-color: var(--brand-primary); background: var(--brand-primary-light); }
.course-check input { width: 18px; height: 18px; accent-color: var(--brand-primary); }
.price-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
@media (max-width: 768px) { .admin-sidebar { display: none; } .admin-main { margin-left: 0; } .price-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="admin-layout">
  <nav class="admin-sidebar">
    <div class="admin-sidebar-brand">Thầy Thuận Toán</div>
    <a href="admin-dashboard.html" class="admin-nav-item">📊 Dashboard</a>
    <a href="admin-brand.html" class="admin-nav-item">🎨 Thương hiệu</a>
    <a href="admin-courses.html" class="admin-nav-item">📚 Khóa học</a>
    <a href="admin-exams.html" class="admin-nav-item">📝 Đề thi</a>
    <a href="admin-docs.html" class="admin-nav-item">📄 Tài liệu</a>
    <a href="admin-combos.html" class="admin-nav-item active">🎁 Combo</a>
    <a href="admin-orders.html" class="admin-nav-item">📦 Đơn hàng</a>
    <a href="admin-codes.html" class="admin-nav-item">🔑 Mã kích hoạt</a>
    <a href="admin-students.html" class="admin-nav-item">👥 Học sinh</a>
    <a href="admin-homepage.html" class="admin-nav-item">🏠 Trang chủ web</a>
  </nav>
  <div class="admin-main">
    <header class="admin-header">
      <h1 class="admin-page-title">Sửa combo</h1>
    </header>
    <div class="admin-content">
      <div class="admin-card" style="max-width:640px">
        <div class="form-group">
          <label class="label">Tên combo</label>
          <input class="input" type="text" value="Combo 3 môn Toán Lý Hóa">
        </div>
        <div class="form-group">
          <label class="label">Chọn khóa học</label>
          <div class="course-check">
            <label><input type="checkbox" checked> Luyện đề THPT 2025 — Toán (299.000₫)</label>
            <label><input type="checkbox" checked> Luyện đề THPT 2025 — Lý (299.000₫)</label>
            <label><input type="checkbox" checked> Luyện đề THPT 2025 — Hóa (299.000₫)</label>
            <label><input type="checkbox"> Chuyên đề Hàm số (199.000₫)</label>
          </div>
        </div>
        <div class="price-row">
          <div class="form-group">
            <label class="label">Giá combo</label>
            <input class="input" type="text" value="699.000">
            <span class="text-xs text-secondary">VNĐ</span>
          </div>
          <div class="form-group">
            <label class="label">Giá gốc (hiện gạch ngang)</label>
            <input class="input" type="text" value="897.000">
            <span class="text-xs text-secondary">VNĐ — tổng giá lẻ</span>
          </div>
        </div>
        <button class="btn btn-primary btn-lg" style="width:100%">Lưu combo</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
