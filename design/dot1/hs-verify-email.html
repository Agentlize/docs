<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xác nhận email — Thầy Thuận Toán</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
</head>
<body>
<header class="hs-header"><div class="hs-header-inner"><a href="hs-home.html" class="hs-logo">Thầy Thuận Toán</a></div></header>

<main class="container-narrow" style="padding-top:var(--space-16);padding-bottom:var(--space-16)">
  <div class="card" style="padding:var(--space-8);text-align:center">
    <div style="font-size:3.5rem;margin-bottom:var(--space-4)">✉️</div>
    <h1 style="font-size:var(--font-2xl);margin-bottom:var(--space-2)">Kiểm tra email</h1>
    <p class="text-secondary" style="margin-bottom:var(--space-5)">
      Chúng tôi đã gửi email xác nhận tới <strong>hocsinh@gmail.com</strong>.<br>
      Nhấn vào link trong email để hoàn tất đăng ký.
    </p>
    <button class="btn btn-outline">Gửi lại email</button>
    <p class="text-xs text-secondary" style="margin-top:var(--space-4)">Không nhận được? Kiểm tra thư mục Spam.</p>
  </div>
</main>

<footer class="hs-footer">Thầy Thuận Toán · thuanthoan.vaohoc.vn</footer>

</html>
