<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thương hiệu — Quản trị</title>
<link rel="stylesheet" href="tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
.upload-zone { border: 2px dashed var(--color-border); border-radius: var(--radius-lg); padding: var(--space-8); text-align: center; color: var(--color-text-secondary); cursor: pointer; }
.upload-zone:hover { border-color: var(--brand-primary); background: var(--brand-primary-light); }
.form-group { margin-bottom: var(--space-5); }
.color-input { display: flex; align-items: center; gap: var(--space-3); }
.color-input input[type="color"] { width: 48px; height: 48px; border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 2px; cursor: pointer; }
.color-input input[type="text"] { flex: 1; }
@media (max-width: 768px) { .admin-sidebar { display: none; } .admin-main { margin-left: 0; } }
</style>
</head>
<body>
<div class="admin-layout">
  <nav class="admin-sidebar">
    <div class="admin-sidebar-brand">Thầy Thuận Toán</div>
    <a href="admin-dashboard.html" class="admin-nav-item">📊 Dashboard</a>
    <a href="admin-brand.html" class="admin-nav-item active">🎨 Thương hiệu</a>
    <a href="admin-courses.html" class="admin-nav-item">📚 Khóa học</a>
    <a href="admin-exams.html" class="admin-nav-item">📝 Đề thi</a>
    <a href="admin-docs.html" class="admin-nav-item">📄 Tài liệu</a>
    <a href="admin-combos.html" class="admin-nav-item">🎁 Combo</a>
    <a href="admin-orders.html" class="admin-nav-item">📦 Đơn hàng</a>
    <a href="admin-codes.html" class="admin-nav-item">🔑 Mã kích hoạt</a>
    <a href="admin-students.html" class="admin-nav-item">👥 Học sinh</a>
    <a href="admin-homepage.html" class="admin-nav-item">🏠 Trang chủ web</a>
  </nav>
  <div class="admin-main">
    <header class="admin-header">
      <h1 class="admin-page-title">Thương hiệu</h1>
      <span class="text-sm text-secondary">thuanthoan.vaohoc.vn</span>
    </header>
    <div class="admin-content">
      <div class="admin-card" style="max-width:640px">
        <div class="form-group">
          <label class="label">Tên thương hiệu</label>
          <input class="input" type="text" value="Thầy Thuận Toán">
        </div>
        <div class="form-group">
          <label class="label">Logo</label>
          <div class="upload-zone">
            <div style="font-size:2rem;margin-bottom:var(--space-2)">📷</div>
            <div>Kéo thả hoặc bấm để tải logo</div>
            <div class="text-xs text-secondary" style="margin-top:var(--space-1)">PNG, JPG — tối đa 2MB</div>
          </div>
        </div>
        <div class="form-group">
          <label class="label">Màu chủ đạo</label>
          <div class="color-input">
            <input type="color" value="#2563EB">
            <input class="input" type="text" value="#2563EB" style="max-width:160px">
          </div>
        </div>
        <div class="form-group">
          <label class="label">Số điện thoại</label>
          <input class="input" type="tel" value="0987 654 321">
        </div>
        <div class="form-group">
          <label class="label">Link Zalo</label>
          <input class="input" type="url" placeholder="https://zalo.me/...">
        </div>
        <div class="form-group">
          <label class="label">Link Facebook</label>
          <input class="input" type="url" placeholder="https://facebook.com/...">
        </div>
        <button class="btn btn-primary btn-lg" style="width:100%">Lưu thương hiệu</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
