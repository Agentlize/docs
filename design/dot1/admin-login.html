<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — vaohoc.vn Quản trị</title>
<link rel="stylesheet" href="tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body { background: var(--admin-primary); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: var(--space-4); }
.login-card { background: var(--color-bg); border-radius: var(--radius-xl); padding: var(--space-10) var(--space-8); width: 100%; max-width: 400px; box-shadow: var(--shadow-lg); }
.login-title { font-size: var(--font-2xl); font-weight: var(--font-bold); text-align: center; margin-bottom: var(--space-1); }
.login-subtitle { text-align: center; color: var(--color-text-secondary); font-size: var(--font-sm); margin-bottom: var(--space-8); }
.form-group { margin-bottom: var(--space-5); }
.login-card .btn { width: 100%; }
.separator { display: flex; align-items: center; gap: var(--space-3); margin: var(--space-5) 0; color: var(--color-text-secondary); font-size: var(--font-sm); }
.separator::before, .separator::after { content: ''; flex: 1; border-top: 1px solid var(--color-border); }
.btn-google { background: var(--color-surface); color: var(--color-text); border: 1px solid var(--color-border); }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-title">vaohoc.vn</div>
  <div class="login-subtitle">Quản trị khóa học</div>
  <form>
    <div class="form-group">
      <label class="label">Email</label>
      <input class="input" type="email" placeholder="email@example.com">
    </div>
    <div class="form-group">
      <label class="label">Mật khẩu</label>
      <input class="input" type="password" placeholder="••••••••">
    </div>
    <button class="btn btn-primary btn-lg" type="submit">Đăng nhập</button>
    <div class="separator">hoặc</div>
    <button class="btn btn-google btn-lg" type="button">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92a8.78 8.78 0 0 0 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.83.86-3.04.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.96 10.71A5.41 5.41 0 0 1 3.68 9c0-.6.1-1.17.28-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.82.96 4.04l3-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.59A9 9 0 0 0 9 0 9 9 0 0 0 .96 4.96l3 2.33C4.67 5.16 6.66 3.58 9 3.58z"/></svg>
      Đăng nhập bằng Google
    </button>
  </form>
</div>
</body>
</html>
