<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đặt lại mật khẩu — Thầy Thuận Toán</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
</head>
<body>
<header class="hs-header"><div class="hs-header-inner"><a href="hs-home.html" class="hs-logo">Thầy Thuận Toán</a></div></header>

<main class="container-narrow" style="padding-top:var(--space-16);padding-bottom:var(--space-16)">
  <div class="card" style="padding:var(--space-6)">
    <h1 style="font-size:var(--font-2xl);margin-bottom:var(--space-1)">Đặt lại mật khẩu</h1>
    <p class="text-secondary text-sm" style="margin-bottom:var(--space-5)">Nhập mật khẩu mới cho tài khoản của bạn.</p>
    <form>
      <label class="label">Mật khẩu mới</label>
      <input type="password" class="input" placeholder="Ít nhất 8 ký tự" style="margin-bottom:var(--space-3)">
      <label class="label">Xác nhận mật khẩu</label>
      <input type="password" class="input" placeholder="Nhập lại mật khẩu" style="margin-bottom:var(--space-4)">
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%">Lưu mật khẩu</button>
    </form>
  </div>
</main>

<footer class="hs-footer">Thầy Thuận Toán · thuanthoan.vaohoc.vn</footer>
</body>
</html>
