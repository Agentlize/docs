<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng ký — Thầy Thuận Toán</title>
<link rel="stylesheet" href="tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
.auth-page { min-height: 100vh; display: flex; flex-direction: column; }
.auth-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: var(--space-6) var(--space-4); background: var(--color-surface); }
.auth-card { background: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-xl); padding: var(--space-8); width: 100%; max-width: 420px; box-shadow: var(--shadow-md); }
.auth-title { font-size: var(--font-2xl); font-weight: var(--font-bold); text-align: center; margin-bottom: var(--space-2); }
.auth-subtitle { text-align: center; color: var(--color-text-secondary); font-size: var(--font-sm); margin-bottom: var(--space-6); }
.form-group { margin-bottom: var(--space-4); }
.auth-or { display: flex; align-items: center; gap: var(--space-3); margin: var(--space-5) 0; color: var(--color-text-secondary); font-size: var(--font-sm); }
.auth-or::before, .auth-or::after { content: ''; flex: 1; border-top: 1px solid var(--color-border); }
.social-btn { width: 100%; padding: var(--space-3) var(--space-4); border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg); display: flex; align-items: center; justify-content: center; gap: var(--space-2); font-size: var(--font-sm); font-weight: var(--font-medium); cursor: pointer; margin-bottom: var(--space-3); }
.social-btn:hover { background: var(--color-surface); }
.auth-footer-link { text-align: center; font-size: var(--font-sm); color: var(--color-text-secondary); margin-top: var(--space-5); }
.auth-footer-link a { color: var(--brand-primary); font-weight: var(--font-medium); }
</style>
</head>
<body>

<div class="auth-page">
<header class="hs-header">
  <div class="hs-header-inner">
    <a href="hs-home.html" class="hs-logo">📐 Thầy Thuận Toán</a>
    <nav class="hs-nav">
      <a href="hs-courses.html">Khóa học</a>
      <a href="hs-login.html" class="btn btn-outline btn-sm">Đăng nhập</a>
    </nav>
  </div>
</header>

<main class="auth-main">
  <div class="auth-card">
    <h1 class="auth-title">Đăng ký</h1>
    <p class="auth-subtitle">Tạo tài khoản để bắt đầu học</p>

    <form>
      <div class="form-group">
        <label class="label" for="name">Họ và tên</label>
        <input class="input" type="text" id="name" placeholder="Nguyễn Văn A">
      </div>
      <div class="form-group">
        <label class="label" for="email">Email</label>
        <input class="input" type="email" id="email" placeholder="email@example.com">
      </div>
      <div class="form-group">
        <label class="label" for="password">Mật khẩu</label>
        <input class="input" type="password" id="password" placeholder="Tối thiểu 8 ký tự">
      </div>
      <div class="form-group">
        <label class="label" for="password2">Xác nhận mật khẩu</label>
        <input class="input" type="password" id="password2" placeholder="Nhập lại mật khẩu">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Đăng ký</button>
    </form>

    <div class="auth-or">hoặc</div>

    <button class="social-btn">🔵 Đăng ký bằng Google</button>
    <button class="social-btn">🔷 Đăng ký bằng Facebook</button>

    <div class="auth-footer-link">
      Đã có tài khoản? <a href="hs-login.html">Đăng nhập</a>
    </div>
  </div>
</main>

<footer class="hs-footer">
  © 2025 Thầy Thuận Toán · Nền tảng Vaohoc.vn
</footer>
</div>

</body>
</html>
