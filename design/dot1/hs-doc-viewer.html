<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xem PDF — Thầy Thuận Toán</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  .viewer-toolbar { display: flex; align-items: center; justify-content: center; gap: var(--space-4); padding: var(--space-3) var(--space-4); background: var(--color-surface); border-bottom: 1px solid var(--color-border); position: sticky; top: 52px; z-index: 5; }
  .viewer-area { background: #E5E7EB; min-height: calc(100vh - 180px); display: flex; align-items: center; justify-content: center; }
  .pdf-page { background: #fff; width: 90%; max-width: 700px; aspect-ratio: 210/297; box-shadow: var(--shadow-lg); display: flex; align-items: center; justify-content: center; color: var(--color-text-secondary); font-size: var(--font-lg); margin: var(--space-6) auto; }
</style>
</head>
<body>

<header class="hs-header"><div class="hs-header-inner"><a href="hs-home.html" class="hs-logo">Thầy Thuận Toán</a><nav class="hs-nav"><a href="hs-docs.html">← Tài liệu</a></nav></div></header>

<div class="viewer-toolbar">
  <button class="btn btn-sm btn-ghost">◀</button>
  <span class="text-sm">Trang <strong>1</strong> / 12</span>
  <button class="btn btn-sm btn-ghost">▶</button>
  <span style="border-left:1px solid var(--color-border);height:20px;margin:0 var(--space-2)"></span>
  <button class="btn btn-sm btn-ghost">➖</button>
  <span class="text-sm">100%</span>
  <button class="btn btn-sm btn-ghost">➕</button>
</div>

<div class="viewer-area">
  <div class="pdf-page">Nội dung PDF hiển thị tại đây</div>
</div>

</body>
</html>
